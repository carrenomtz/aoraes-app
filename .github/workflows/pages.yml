name: Publicar sitio (Pages)

# Publica el sitio SIN los archivos internos (reglas de Firestore, pruebas, scripts, configuración de Firebase).
# Antes Pages servía la raíz entera del repositorio y esos archivos eran públicos.
# Requiere Settings → Pages → Source = «GitHub Actions».
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar _site sin archivos internos
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='tests' --exclude='scripts' \
            --exclude='firestore.rules' --exclude='firebase.json' --exclude='.firebaserc' \
            --exclude='.gitignore' --exclude='*.patch' --exclude='*.md' \
            ./ _site/
          touch _site/.nojekyll
      - name: Comprobar que el sitio está completo y sin archivos internos
        run: |
          for f in index.html analisis.html jubilacion.html necesidades.html plan-futuro.html vsp.html preguntas-medicas.html CNAME robots.txt sw.js estudio/index.html; do test -f "_site/$f" || { echo "FALTA $f"; exit 1; }; done
          for f in firestore.rules firebase.json .firebaserc tests scripts; do test ! -e "_site/$f" || { echo "EXPUESTO $f"; exit 1; }; done
          echo "Sitio listo: $(find _site -type f | wc -l) archivos"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
